version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: difflens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: difflens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: difflens_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d difflens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: difflens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: difflens-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:difflens_dev_password@db:5432/difflens
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_WEBHOOK_SECRET=development_webhook_secret_key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: difflens-worker
    restart: unless-stopped
    command: python -m app.worker
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:difflens_dev_password@db:5432/difflens
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
